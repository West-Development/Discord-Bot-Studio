<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Discord Bot Studio</title>
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-left" style="display:flex;align-items:center;">
            <button id="back-to-menu-btn" title="Back to Main Menu" style="margin-right: 8px; padding: 5px 10px; font-weight: 700;">←</button>
            <select id="bot-selector" class="form-control" style="width: 200px;">
                <option value="">Select Bot</option>
            </select>
            <button id="create-bot-btn" class="btn btn-primary" style="margin-left: 8px;">+ New Bot</button>
            <span id="bot-status-badge" class="badge badge-secondary" style="margin-left: 8px; padding: 4px 8px; border-radius: 4px; font-size: 11px;">Offline</span>
        </div>
        <div class="toolbar-right" style="display:flex;gap:8px;">
            <button id="toggle-bot-btn" style="background: #388a34; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: 600; cursor: pointer;">Start Bot</button>
            <button id="restart-bot-btn" style="background: #d97706; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: 600; cursor: pointer;">Restart Bot</button>
        </div>
    </header>

    <nav class="sub-nav" style="display:flex;background:#212429;border-bottom:1px solid #343942;padding:0 12px;gap:4px;">
        <button class="nav-item active" data-tab="commands" style="background:transparent;border:none;color:#fff;padding:10px 16px;cursor:pointer;border-bottom:2px solid #007acc;">Commands</button>
        <button class="nav-item" data-tab="events" style="background:transparent;border:none;color:#888;padding:10px 16px;cursor:pointer;">Events</button>
        <button class="nav-item" data-tab="console" style="background:transparent;border:none;color:#888;padding:10px 16px;cursor:pointer;">Console</button>
        <button class="nav-item" data-tab="settings" style="background:transparent;border:none;color:#888;padding:10px 16px;cursor:pointer;">Settings</button>
        <button class="nav-item" data-tab="database" style="background:transparent;border:none;color:#888;padding:10px 16px;cursor:pointer;">Database</button>
    </nav>

    <main id="workspace" style="flex:1;display:flex;position:relative;overflow:hidden;">
        <!-- Commands Tab -->
        <section id="tab-commands" class="tab-pane" style="display:flex;width:100%;height:100%;position:absolute;inset:0;">
            <aside style="width:260px;background:#1e2227;border-right:1px solid #343942;display:flex;flex-direction:column;">
                <div style="padding:12px;border-bottom:1px solid #343942;display:flex;gap:4px;">
                    <button id="new-command-btn" class="btn btn-primary" style="flex:1;background:#007acc;border:none;color:#fff;padding:8px;border-radius:4px;cursor:pointer;">+ New</button>
                    <button id="import-command-btn" class="btn btn-secondary" style="flex:1;background:#2c313a;border:1px solid #474747;color:#fff;padding:8px;border-radius:4px;cursor:pointer;">Import</button>
                </div>
                <div id="command-list" style="flex:1;overflow-y:auto;padding:8px;"></div>
            </aside>
            <main style="flex:1;display:flex;flex-direction:column;background:#181a1d;padding:16px;gap:16px;overflow:hidden;">
                <div id="cmd-name-bar" style="display: flex; align-items: center; gap: 10px; background: #212429; padding: 10px 12px; border: 1px solid #343942; border-radius: 4px; margin-bottom: 10px;">
                  <label for="cmd-name" style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; white-space: nowrap;">Command File Name:</label>
                  <input type="text" id="cmd-name" placeholder="e.g. remove_role" style="flex: 1; background: #181a1d; border: 1px solid #3c424d; color: #ffffff; padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none;" />
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div style="display:flex;gap:8px;">
                        <button id="add-action-btn" class="btn btn-primary" style="background:#007acc;border:none;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;">+ Add Action</button>
                        <button id="move-action-up" class="btn btn-secondary" style="background:#2c313a;border:1px solid #474747;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;">▲</button>
                        <button id="move-action-down" class="btn btn-secondary" style="background:#2c313a;border:1px solid #474747;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;">▼</button>
                        <button id="remove-action-btn" class="btn btn-danger" style="background:#c72e2e;border:none;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;">Remove</button>
                        <button id="export-command-btn" class="btn-secondary" style="margin-left: auto; background: #2c313a; color: #fff; padding: 6px 18px; border-radius: 4px; border: 1px solid #474747; font-weight: 600; cursor: pointer;">Export</button>
                        <button id="save-command-btn" class="btn-success" style="margin-left: 8px; background: #2e8540; color: #fff; padding: 6px 18px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer;">Save Command</button>
                    </div>
                </div>
                <div class="action-table-box" style="flex:1;border-radius:6px;overflow-y:auto;min-height:0;">
                    <table>
                        <thead style="position:sticky;top:0;">
                            <tr style="text-align:left;">
                                <th style="width:85px;">#</th>
                                <th style="width:240px;">Type</th>
                                <th>Action Summary</th>
                            </tr>
                        </thead>
                        <tbody id="action-list-body"></tbody>
                    </table>
                </div>
            </main>
        </section>

        <!-- Events Tab -->
        <section id="tab-events" class="tab-pane" style="display:none;width:100%;height:100%;position:absolute;inset:0;">
            <aside style="width:260px;background:#1e2227;border-right:1px solid #343942;display:flex;flex-direction:column;">
                <div style="padding:12px;border-bottom:1px solid #343942;display:flex;gap:4px;">
                    <button id="new-event-btn" class="btn btn-primary" style="flex:1;background:#007acc;border:none;color:#fff;padding:8px;border-radius:4px;cursor:pointer;">+ New Event</button>
                    <button id="import-event-btn" class="btn btn-secondary" style="flex:1;background:#2c313a;border:1px solid #474747;color:#fff;padding:8px;border-radius:4px;cursor:pointer;">Import</button>
                </div>
                <div id="event-list" style="flex:1;overflow-y:auto;padding:8px;"></div>
            </aside>
            <main style="flex:1;display:flex;flex-direction:column;background:#181a1d;padding:16px;gap:16px;overflow:hidden;">
                <div id="event-name-bar" style="display: flex; align-items: center; gap: 10px; background: #212429; padding: 10px 12px; border: 1px solid #343942; border-radius: 4px; margin-bottom: 10px;">
                  <label for="event-name" style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; white-space: nowrap;">Event File Name:</label>
                  <input type="text" id="event-name" placeholder="e.g. welcome_message" style="flex: 1; background: #181a1d; border: 1px solid #3c424d; color: #ffffff; padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none;" />
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <div style="display:flex;gap:8px;">
                        <button id="event-add-action-btn" class="btn btn-primary" style="background:#007acc;border:none;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;">+ Add Action</button>
                        <button id="event-move-up-btn" class="btn btn-secondary" style="background:#2c313a;border:1px solid #474747;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;">▲</button>
                        <button id="event-move-down-btn" class="btn btn-secondary" style="background:#2c313a;border:1px solid #474747;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;">▼</button>
                        <button id="event-remove-action-btn" class="btn btn-danger" style="background:#c72e2e;border:none;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer;">Remove</button>
                        <button id="export-event-btn" class="btn-secondary" style="margin-left: auto; background: #2c313a; color: #fff; padding: 6px 18px; border-radius: 4px; border: 1px solid #474747; font-weight: 600; cursor: pointer;">Export</button>
                        <button id="save-event-btn" class="btn-success" style="margin-left: 8px; background: #2e8540; color: #fff; padding: 6px 18px; border-radius: 4px; border: none; font-weight: 600; cursor: pointer;">Save Event</button>
                    </div>
                </div>
                <div class="action-table-box" style="flex:1;border-radius:6px;overflow-y:auto;min-height:0;">
                    <table>
                        <thead style="position:sticky;top:0;">
                            <tr style="text-align:left;">
                                <th style="width:85px;">#</th>
                                <th style="width:240px;">Type</th>
                                <th>Action Summary</th>
                            </tr>
                        </thead>
                        <tbody id="event-action-list-body"></tbody>
                    </table>
                </div>
            </main>
        </section>

        <!-- Console Tab -->
        <section id="tab-console" class="tab-pane" style="display:none;width:100%;height:100%;position:absolute;inset:0;flex-direction:column;background:#0f1115;">
            <div id="console-output" style="flex:1;padding:16px;overflow-y:auto;font-family:monospace;font-size:13px;"></div>
            <div style="padding:12px;background:#181a1d;border-top:1px solid #343942;display:flex;gap:8px;">
                <input type="text" id="console-input" placeholder="Type command for bot process..." class="form-control" style="flex:1;background:#212429;border:1px solid #343942;color:#fff;padding:6px 12px;border-radius:4px;" />
            </div>
        </section>

                    <!-- Settings Tab -->
        <section id="tab-settings" class="tab-pane" style="display:none;width:100%;height:100%;position:absolute;inset:0;padding:24px;flex-direction:column;gap:20px;background:#181a1d;color:#e2e8f0;overflow-y:auto;box-sizing:border-box;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;max-width:1280px;width:100%;box-sizing:border-box;">
                <!-- Left Card: Bot Settings -->
                <div style="background:#212429;border:1px solid #343942;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:14px;width:100%;box-sizing:border-box;">
                    <div style="font-size:16px;font-weight:700;color:#ffffff;border-bottom:1px solid #343942;padding-bottom:10px;">Bot Settings</div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:12px;color:#94a3b8;font-weight:600;">Bot Token</label>
                        <input type="password" id="bot-token" class="form-control" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#fff;padding:8px 10px;border-radius:4px;" />
                    </div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:12px;color:#94a3b8;font-weight:600;">Client ID</label>
                        <input type="text" id="bot-client-id" class="form-control" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#fff;padding:8px 10px;border-radius:4px;" />
                    </div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:12px;color:#94a3b8;font-weight:600;">Client Secret</label>
                        <input type="password" id="bot-client-secret" class="form-control" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#fff;padding:8px 10px;border-radius:4px;" />
                    </div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:12px;color:#94a3b8;font-weight:600;">Test Server / Guild ID (Optional - Instant Slash Sync)</label>
                        <input type="text" id="cfg-guildId" class="form-control" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#fff;padding:8px 10px;border-radius:4px;" />
                    </div>

                    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
                        <button id="save-settings-btn" class="btn btn-primary" style="background:#28a745;border:none;color:#fff;padding:8px 16px;border-radius:4px;font-weight:600;cursor:pointer;">Save Settings</button>
                        <button id="update-bot-base-btn" style="background:#2b82d9;border:none;color:#fff;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:600;">Update Bot Files</button>
                        <button id="export-bot-btn" style="background:#2c313a;border:1px solid #474747;color:#fff;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:600;">Export Bot</button>
                        <button id="import-bot-btn" style="background:#2c313a;border:1px solid #474747;color:#fff;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:600;">Import Bot</button>
                    </div>

                    <div id="update-base-log" style="display:none;margin-top:6px;background:#0d0f12;border:1px solid #343942;border-radius:4px;padding:10px;font-family:Consolas,monospace;font-size:12px;color:#4ade80;max-height:140px;overflow-y:auto;white-space:pre-wrap;"></div>
                </div>

                <!-- Right Card: Bot Profile (Name, Description, Logo) -->
                <div style="background:#212429;border:1px solid #343942;border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:14px;width:100%;box-sizing:border-box;">
                    <div style="font-size:16px;font-weight:700;color:#ffffff;border-bottom:1px solid #343942;padding-bottom:10px;">Bot Profile</div>

                    <div style="display:flex;align-items:center;gap:14px;">
                        <div id="edit-bot-icon-preview" style="width:64px;height:64px;border-radius:50%;background:#181a1d;border:1px solid #3c424d;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex-shrink:0;">🤖</div>
                        <div style="flex:1;">
                            <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Bot Logo / Avatar</label>
                            <input type="file" id="edit-bot-icon-file" accept="image/*" style="width:100%;color:#cbd5e1;font-size:12px;" />
                        </div>
                    </div>

                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Bot Name</label>
                        <input type="text" id="edit-bot-name" placeholder="My Discord Bot" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;" />
                    </div>

                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Bot Description</label>
                        <textarea id="edit-bot-desc" rows="4" placeholder="What does this bot do?" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;font-family:inherit;"></textarea>
                    </div>

                    <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
                        <button id="save-bot-profile-btn" class="btn btn-primary" style="background:#007acc;border:none;color:#fff;padding:8px 16px;border-radius:4px;font-weight:600;cursor:pointer;">Save Bot Profile</button>
                        <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8;cursor:pointer;">
                            <input type="checkbox" id="sync-discord-profile" checked style="accent-color:#007acc;"> Also update on Discord if online
                        </label>
                    </div>
                </div>
            </div>
        </section>


        <!-- Database Tab -->
        <section id="tab-database" class="tab-pane" style="display:none;width:100%;height:100%;position:absolute;inset:0;background:#181a1d;padding:24px;overflow-y:auto;">
            <div style="max-width:600px;width:100%;display:flex;flex-direction:column;gap:16px;">
                <div style="display:flex;align-items:center;justify-content:space-between;background:#212429;padding:14px 16px;border:1px solid #343942;border-radius:6px;">
                    <div>
                        <div style="font-size:15px;font-weight:700;color:#ffffff;">External Database Connection</div>
                        <div style="font-size:12px;color:#94a3b8;margin-top:2px;">Save database credentials into this bot's <code>config/bot.js</code>.</div>
                    </div>
                    <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;">
                        <input type="checkbox" id="db-enabled" style="display:none;">
                        <span id="db-toggle-track" style="width:44px;height:24px;background:#343942;border-radius:999px;position:relative;transition:0.2s;display:inline-block;">
                            <span id="db-toggle-knob" style="width:18px;height:18px;background:#ffffff;border-radius:50%;position:absolute;top:3px;left:3px;transition:0.2s;"></span>
                        </span>
                        <span id="db-toggle-text" style="font-size:12px;font-weight:600;color:#94a3b8;">Off</span>
                    </label>
                </div>

                <div id="db-fields-container" style="display:flex;flex-direction:column;gap:12px;opacity:0.5;pointer-events:none;">
                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Database Type</label>
                        <select id="db-type" style="width:100%;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;">
                            <option value="json">Local JSON (Default Built-In)</option>
                            <option value="mysql">MySQL / MariaDB</option>
                            <option value="postgresql">PostgreSQL</option>
                            <option value="sqlite">SQLite File</option>
                            <option value="mongodb">MongoDB</option>
                        </select>
                    </div>

                    <div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;">
                        <div>
                            <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Host</label>
                            <input type="text" id="db-host" placeholder="localhost" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;" />
                        </div>
                        <div>
                            <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Port</label>
                            <input type="number" id="db-port" placeholder="3306" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;" />
                        </div>
                    </div>

                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Database Name</label>
                        <input type="text" id="db-name" placeholder="my_bot_db" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;" />
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                        <div>
                            <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Username</label>
                            <input type="text" id="db-user" placeholder="root" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;" />
                        </div>
                        <div>
                            <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Password</label>
                            <input type="password" id="db-password" placeholder="••••••••" style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;" />
                        </div>
                    </div>

                    <div>
                        <label style="display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#94a3b8;margin-bottom:6px;">Connection URI (Optional)</label>
                        <input type="text" id="db-uri" placeholder="mongodb+srv://... or postgres://..." style="width:100%;box-sizing:border-box;background:#181a1d;border:1px solid #3c424d;color:#ffffff;padding:8px 10px;border-radius:4px;font-size:13px;" />
                    </div>
                </div>

                <div>
                    <button id="save-database-btn" class="btn btn-primary" style="background:#007acc;border:none;color:#fff;padding:8px 16px;border-radius:4px;font-weight:600;cursor:pointer;">Save Database Config</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Create Bot Modal -->
    <div id="create-bot-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:9999;">
        <div style="background:#212429;width:420px;padding:24px;border-radius:6px;border:1px solid #343942;display:flex;flex-direction:column;gap:16px;color:#fff;">
            <h3>Create New Bot</h3>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label>Bot Name</label>
                <input type="text" id="new-bot-name" placeholder="My Awesome Bot" class="form-control" style="background:#181a1d;border:1px solid #343942;color:#fff;padding:6px 12px;border-radius:4px;" />
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label>Description</label>
                <input type="text" id="new-bot-desc" placeholder="A cool Discord bot" class="form-control" style="background:#181a1d;border:1px solid #343942;color:#fff;padding:6px 12px;border-radius:4px;" />
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;">
                <label>Bot Icon (Image)</label>
                <input type="file" id="bot-icon-file" accept="image/*" />
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
                <button id="cancel-create-bot" class="btn btn-secondary" style="background:transparent;border:1px solid #474747;color:#ccc;padding:6px 16px;border-radius:4px;cursor:pointer;">Cancel</button>
                <button id="confirm-create-bot" class="btn btn-primary" style="background:#007acc;border:none;color:#fff;padding:6px 16px;border-radius:4px;cursor:pointer;">Create</button>
            </div>
        </div>
    </div>

    <!-- Action Editor Modal -->
    <div id="action-modal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.78); align-items: center; justify-content: center; z-index: 9999; overscroll-behavior: contain;">
      <div class="modal-card" style="background: #212429; border: 1px solid #3c424d; border-radius: 6px; width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-height: 85vh; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #343942; padding-bottom: 10px;">
          <h3 id="action-modal-title" style="margin: 0; color: #fff; font-size: 15px;">Configure Action</h3>
          <button id="close-action-modal" style="background: transparent; border: none; color: #94a3b8; font-size: 18px; cursor: pointer;">×</button>
        </div>

        <!-- Custom Action Dropdown -->
        <div style="display: flex; flex-direction: column; gap: 6px; position: relative;">
          <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Action Type</label>
          <input type="hidden" id="selected-action-type" value="send_message">
          <div id="custom-action-dropdown" style="position: relative; width: 100%;">
            <button id="action-dropdown-trigger" type="button" style="width: 100%; background: #181a1d; border: 1px solid #3c424d; color: #e2e8f0; padding: 10px 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; text-align: left;">
              <span id="action-dropdown-label">Send Message</span>
              <span style="color: #94a3b8; font-size: 12px;">▼</span>
            </button>
            <div id="action-dropdown-menu" style="display: none; position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #181a1d; border: 1px solid #3c424d; border-radius: 6px; max-height: 260px; overflow-y: auto; z-index: 10000; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overscroll-behavior: contain;">
              <div style="position: sticky; top: 0; z-index: 2; background: #181a1d; padding: 8px; border-bottom: 1px solid #3c424d;">
                <input type="text" id="action-dropdown-search" placeholder="Search actions..." style="width: 100%; background: #212429; border: 1px solid #3c424d; color: #e2e8f0; padding: 6px 10px; border-radius: 4px; font-size: 12px; box-sizing: border-box;">
              </div>
              <div id="action-dropdown-options-container"></div>
            </div>
          </div>
        </div>

        <div id="action-dynamic-fields" style="display: flex; flex-direction: column; gap: 12px;"></div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #343942; padding-top: 12px;">
          <button id="cancel-action-btn" style="background: #2a2e35; border: 1px solid #3c424d; color: #e2e8f0; padding: 6px 14px; border-radius: 4px; cursor: pointer;">Cancel</button>
          <button id="save-action-btn" style="background: #2b82d9; border: none; color: #fff; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: 600;">Save Action</button>
        </div>
      </div>
    </div>

    <!-- Renderer Scripts -->
    <script src="renderer/bots.js"></script>
    <script src="renderer/console.js"></script>
    <script src="renderer/action-modal.js"></script>
    <script src="renderer/commands.js"></script>
    <script src="renderer/boot.js"></script>
    <script src="renderer/state.js"></script>
<script src="renderer/events.js"></script>
</body>
</html>
